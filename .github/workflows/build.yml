# Every push to main builds the APK (downloadable from the run's artifacts).
# Pushing a tag like v2.9.1 also publishes it as a GitHub Release, which the app
# offers as an update the next time it opens.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

# Don't run two builds of the same branch/tag at once.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Tag must look like v2.9.1 (minor and patch below 100)"; exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION=0.0.1; fi
          gradle assembleRelease -PappVersion="$VERSION"
          cp build/outputs/apk/release/*.apk budget.apk
          rm -f release.jks

      - uses: actions/upload-artifact@v7
        with:
          name: budget-apk
          path: budget.apk

      # Re-running a release job replaces the APK instead of failing.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" budget.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" budget.apk --title "$GITHUB_REF_NAME" --generate-notes
          fi
